preset = "growing-2d"

[input]
shared_base = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/shared_base.bpk"
adapter_bank = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/adapter_bank.json"
train_limit = 900
holdout_limit = 100

[output]
output_dir = "artifacts/hyper2d_adapter_bank_omnisvg_1k_dino"

[condition]
encoder = "dino"
dino_model = "models/dino/dino_vits.mpk"
dino_image_size = 518
dino_batch_size = 4
feature_cache = "artifacts/hyper2d_adapter_bank_omnisvg_1k_dino/dino_features.json"

[training]
backend = "burn-wgpu"
hidden = 512
output_scale = 0.0
canonicalize_adapters = true
seed = 42
steps = 600
report_interval = 100
example_batch_size = 128
learning_rate = 1.0e-3
weight_decay = 0.0
grad_clip_norm = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 1.0e-8

[eval]
vector_examples = 256
rollout_examples = 8
particles = 64
steps = 8
update_prob = 0.5
seed = 42
seed_mode = "uniform-circle"

[target]
points = 256
threshold = 0.05
loss_image_size = 64
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0
