preset = "growing-2d"

[input]
shared_base = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/shared_base.bpk"
adapter_bank = "artifacts/hyper2d_exact_oracle_bank_10k8x8_2048_rank132_bias_exact_train_all/adapter_bank.json"
initial_hyper = "artifacts/hyper2d_adapter_bank_exact_oracle_10k8x8_dino_token_grid_flow_zero_source_h384_lr2e3_train_all/hyper_2d.json"
train_limit = 16
holdout_limit = 0

[output]
output_dir = "artifacts/hyper2d_adapter_bank_exact_oracle_10k8x8_dino_token_grid_flow_zero_source_h384_lr2e4_refine_train_all"

[condition]
encoder = "dino-vits-token-grid"
dino_model = "models/dino/dino_vits.mpk"
dino_image_size = 518
dino_batch_size = 1
dino_cache_write_interval_batches = 4
feature_cache = "artifacts/hyper2d_adapter_bank_exact_oracle_10k8x8_dino_token_grid_flow_overfit_train_all/dino_features_8x8.json"
token_grid_width = 8
token_grid_height = 8

[training]
backend = "burn-wgpu"
objective = "rectified-flow"
hidden = 1
output_scale = 0.0
canonicalize_adapters = true
flow_hidden = 384
flow_sample_steps = 16
flow_source_scale = 0.0
flow_hidden_activation = "leaky-relu"
flow_init = "from-hyper"
diagnostic_vector_examples = 16
loss_eval_batch_size = 16
system_memory_budget_gb = 12.0
seed = 69
steps = 6000
report_interval = 500
example_batch_size = 16
learning_rate = 2.0e-4
weight_decay = 0.0
grad_clip_norm = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 1.0e-8

[eval]
vector_examples = 16
rollout_examples = 4
particles = 2048
steps = 32
update_prob = 0.5
seed = 69
seed_mode = "uniform-circle"

[target]
points = 2048
threshold = 0.05
loss_image_size = 128
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0
