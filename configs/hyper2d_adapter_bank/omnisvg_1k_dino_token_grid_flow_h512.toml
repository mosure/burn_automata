preset = "growing-2d"

[input]
shared_base = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/shared_base.bpk"
adapter_bank = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/adapter_bank.json"
train_limit = 900
holdout_limit = 100

[output]
output_dir = "artifacts/hyper2d_adapter_bank_omnisvg_1k_dino_token_grid_flow_h512"

[condition]
encoder = "dino-vits-token-grid"
dino_model = "models/dino/dino_vits.mpk"
dino_image_size = 518
dino_batch_size = 1
dino_cache_write_interval_batches = 16
feature_cache = "artifacts/hyper2d_adapter_bank_omnisvg_1k_dino_token_grid_8x8/dino_features.json"
token_grid_width = 8
token_grid_height = 8

[training]
backend = "burn-wgpu"
objective = "rectified-flow"
hidden = 512
output_scale = 0.0
canonicalize_adapters = true
flow_hidden = 512
flow_sample_steps = 16
loss_eval_batch_size = 128
system_memory_budget_gb = 16.0
seed = 51
steps = 3000
report_interval = 250
example_batch_size = 256
learning_rate = 2.0e-3
weight_decay = 1.0e-5
grad_clip_norm = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 1.0e-8

[eval]
vector_examples = 512
rollout_examples = 8
particles = 2048
steps = 32
update_prob = 0.5
seed = 51
seed_mode = "uniform-circle"

[target]
points = 2048
threshold = 0.05
loss_image_size = 128
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0
