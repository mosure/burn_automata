preset = "growing-2d"

[input]
shared_base = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/shared_base.bpk"
adapter_bank = "artifacts/hyper2d_exact_oracle_bank_10k16_2048_rank132_bias_exact/adapter_bank.json"

[output]
output_dir = "artifacts/hyper2d_adapter_bank_exact_oracle_10k16_2048_rank132_bias_exact_closedform"

[condition]
encoder = "summary-tokens"
token_grid_width = 4
token_grid_height = 4

[training]
backend = "linear-solve"
hidden = 706
output_scale = 0.0
linear_output = true
seed = 42
steps = 1
report_interval = 1
example_batch_size = 16
learning_rate = 1.0e-3
weight_decay = 0.0
grad_clip_norm = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 1.0e-8

[eval]
vector_examples = 16
rollout_examples = 16
particles = 2048
steps = 32
update_prob = 0.5
seed = 42
seed_mode = "uniform-circle"

[target]
points = 2048
threshold = 0.05
loss_image_size = 128
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0
