preset = "growing-2d"

[input]
shared_base = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/shared_base.bpk"
adapter_bank = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/adapter_bank.json"
train_limit = 2
holdout_limit = 1

[output]
output_dir = "artifacts/hyper2d_adapter_bank_omnisvg_3_dino_full_tokens_flow_smoke"

[condition]
encoder = "dino-vits-token-grid"
dino_model = "models/dino/dino_vits.mpk"
dino_image_size = 518
dino_batch_size = 1
dino_cache_write_interval_batches = 1
feature_cache = "artifacts/hyper2d_adapter_bank_omnisvg_3_dino_full_tokens_flow_smoke/dino_features.json"
# 518px DINO ViT-S/14 images produce a 37x37 patch-token grid. This preserves
# CLS plus every patch token instead of a global mean descriptor.
token_grid_width = 37
token_grid_height = 37

[training]
backend = "burn-wgpu"
objective = "rectified-flow"
hidden = 1
output_scale = 0.0
canonicalize_adapters = true
flow_hidden = 16
flow_sample_steps = 2
loss_eval_batch_size = 1
system_memory_budget_gb = 12.0
seed = 52
steps = 1
report_interval = 1
example_batch_size = 1
learning_rate = 1.0e-3
weight_decay = 1.0e-5
grad_clip_norm = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 1.0e-8

[eval]
vector_examples = 1
rollout_examples = 0
particles = 64
steps = 0
update_prob = 0.5
seed = 52
seed_mode = "uniform-circle"

[target]
points = 256
threshold = 0.05
loss_image_size = 64
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0
