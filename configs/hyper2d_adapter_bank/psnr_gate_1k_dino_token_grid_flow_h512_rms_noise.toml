preset = "growing-2d"

[input]
base_model = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/shared_base.bpk"
adapter_bank = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/adapter_bank.json"
oracle_report = "artifacts/hyper2d_omnisvg_10k_quality_2048_oracle_zero/report.json"
hyper = "artifacts/hyper2d_adapter_bank_omnisvg_1k_dino_token_grid_flow_h512_rms_noise/hyper_2d.json"

[condition]
dino_model = "models/dino/dino_vits.mpk"
dino_image_size = 518
dino_batch_size = 4
dino_cache_write_interval_batches = 16
feature_cache = "artifacts/hyper2d_adapter_bank_omnisvg_1k_dino_token_grid_flow_h512_rms_noise/dino_features.json"
token_grid_width = 8
token_grid_height = 8

[output]
output = "artifacts/hyper2d_adapter_bank_omnisvg_1k_dino_token_grid_flow_h512_rms_noise/psnr_gate_report.json"
generated_dir = "artifacts/hyper2d_adapter_bank_omnisvg_1k_dino_token_grid_flow_h512_rms_noise/psnr_gate_generated"

[eval]
limit = 16
particles = 2048
steps = [32, 64]
update_prob = 0.5
seed = 42
seed_mode = "uniform-circle"
image_size = 128
render_sigma_px = 1.0

[gate]
min_render_rgb_psnr_db = 26.0
fail_on_threshold = true
