preset = "growing-2d"

[source]
source_limit = 0

[source.omnisvg]
dataset = "illustration"
split = "train"
cache_dir = "data/omnisvg"
offset = 0
limit = 32
page_size = 100
download = false
refresh = false
token_env = "HF_TOKEN"

[split]
holdout_stride = 5
holdout_offset = 0

[output]
output_dir = "artifacts/hyper2d_omnisvg_smoke_particles64_tbptt"

[training]
device = "gpu"
steps = 2
report_interval = 1
example_batch_size = 4
tbptt_chunk_steps = 4
eval_interval = 1
eval_batch_size = 1
system_memory_budget_gb = 12.0
gpu_memory_budget_gb = 8.0
max_dense_train_particles = 1024

[gpu]
backend = "burn-wgpu"
device = "cuda:0"
max_dense_chunk_floats = 1048576
max_splat_chunk_floats = 1048576

[adapter]
rank = 16
alpha = 16.0

[rollout]
particles = 64
steps = 8
update_prob = 0.5
seed = 42
base_seed = 42
seed_mode = "uniform-circle"

[target]
points = 128
threshold = 0.05
loss_image_size = 32
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0

[optimizer]
per_parameter_grad_normalization = true
base_learning_rate = 1.0e-4
base_weight_decay = 0.0
base_grad_clip_norm = 1.0
adapter_learning_rate = 1.0e-3
adapter_weight_decay = 0.0
adapter_grad_clip_norm = 1.0
adapter_l2 = 0.0

[train_refine]
steps = 2
batch_size = 4
learning_rate = 1.0e-3
weight_decay = 0.0
grad_clip_norm = 1.0

[holdout_adapter]
steps = 2
batch_size = 4
learning_rate = 1.0e-3
weight_decay = 0.0
grad_clip_norm = 1.0

[eval]
examples = 4
seed = 42

[oracle]
train_examples = 0
holdout_examples = 0
epochs = 1
repetitions = 1
report_interval = 1
batch_size = 1
pool_size = 64
learning_rate = 5.0e-4
weight_decay = 0.0
grad_clip_norm = 1.0
seed = 42
