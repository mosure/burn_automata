preset = "growing-2d"

[input]
shared_base = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/shared_base.bpk"
adapter_bank = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_adamw_batch64_600_300_300_eval1000_oracle2x2/adapter_bank.json"

[selection]
selection_seed = 42
selection_manifest = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_oracle_quality2048_model_batch2_smoke/oracle_selection_2x0.json"

[output]
report_output = "artifacts/hyper2d_omnisvg_10k_burn_wgpu_oracle_quality2048_model_batch2_smoke/report.json"

[rollout]
particles = 2048
steps = 1
update_prob = 0.5
seed = 42
seed_scale = 0.5
seed_mode = "uniform-circle"

[target]
points = 2048
threshold = 0.05
loss_image_size = 128
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0

[optimizer]
per_parameter_grad_normalization = true

[oracle]
backend = "burn-wgpu"
resume_existing = false
gpu_parallel_jobs = 2
train_examples = 2
holdout_examples = 0
epochs = 1
repetitions = 1
report_interval = 1
batch_size = 1
pool_size = 8
learning_rate = 5.0e-4
weight_decay = 0.0
grad_clip_norm = 1.0
seed = 42
