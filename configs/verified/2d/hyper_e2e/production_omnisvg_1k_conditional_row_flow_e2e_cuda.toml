# Teacher-free 1k generalization experiment. The upstream-parity lizard is an
# initialization only; both the shared NPA trunk and conditioned row flow are
# optimized from rollout image loss. Oracle models are reserved for evaluation.
preset = "growing-2d"

[source]
source_limit = 1000

[source.omnisvg]
dataset = "illustration"
split = "train"
cache_dir = "data/omnisvg"
offset = 0
limit = 1000
page_size = 1000
download = true
refresh = false
token_env = "HF_TOKEN"

[split]
holdout_stride = 10
holdout_offset = 9

[output]
output_dir = "artifacts/hyper2d_omnisvg_1k_row_flow_e2e_cuda"
checkpoint_interval_steps = 500
checkpoint_interval_seconds = 900
auto_resume = true

[condition]
encoder = "dino-vits-full-tokens"
dino_model = "models/dino/dino_vits.mpk"
dino_image_size = 224
dino_patch_size = 14
dino_batch_size = 32
online = true
token_attention_heads = 12
rgb_channels = true
rgb_channel_scale = 1.0
alpha_channel = true
alpha_channel_scale = 1.0
# Preserve every aligned 14 x 14 RGBA patch alongside its DINO token. This is
# lossless with respect to the native 224 x 224 condition image.
patch_pixels = true

[model]
shared_base = "models/catalog/growing/lizard.bpk"
shared_base_trainable = true
# The frozen-trunk control plateaued in aggregate held-out PSNR by step 1000
# while condition-shuffle separation continued improving. Start joint trunk
# adaptation here and retain the step-1000 generated checkpoint as incumbent.
shared_base_train_start_step = 1000
hidden_dims = 128
output_activation = "identity"

[training]
backend = "gpu"
objective = "conditional-row-flow-e2e"
steps = 100000
report_interval = 100
# Quality-scale shape: 8 independent image conditions x 4 trajectories x 4096
# particles. Each identity owns eight persistent pool slots and accumulates at
# least eight independent trajectories across successive visits. Keeping all
# eight trajectories live in one full-BPTT graph exceeds a 96 GiB device.
example_batch_size = 8
credit_assignment = "full-bptt"
task_loss_weight = 1.0
flow_matching_weight = 0.0
flow_self_rectification_weight = 0.05
flow_train_sample_steps = 4
# Permit the verified frozen-trunk checkpoint to enter the joint-training
# curriculum without weakening source/hash validation.
curriculum_resume = true
max_full_bptt_particle_steps = 33554432
use_particle_pool = true
pool_slots_per_example = 8
rollouts_per_example = 4
# 900 train identities x 8 persistent slots = 7200; retain eviction headroom.
pool_capacity = 8000
inject_seed_interval = 4
seed_replacements_per_interval = 2
seed_trajectory_interval = 16
brush_size = 0.1
pre_rollout_steps = 0
target2d_loss_backend = "tiled-adjoint"
perception_backend = "auto"
max_dense_train_particles = 4096
system_memory_budget_gb = 24.0
gpu_memory_budget_gb = 90.0
seed = 42

[gpu]
backend = "burn-cuda"
max_dense_chunk_floats = 1048576
max_splat_chunk_floats = 1048576
# The 900-row training split is 1.006 GiB. Keep it device-resident instead of
# repeating a roughly 330 ms DINO forward on every optimizer step.
condition_device_cache_max_bytes = 1342177280
target_device_cache_max_bytes = 1073741824

[adapter]
rank = 66
alpha = 66.0
generator = "conditional-row-flow"
parameterization = "dense-npa-row-residual"
attention_normalization = "softmax"
flow_hidden = 768
flow_layers = 12
flow_ffn_dims = 3072
# Four Heun steps retain eight velocity evaluations while allowing twice the
# condition diversity of the eight-step solver at the measured memory limit.
flow_sample_steps = 4
flow_source_seed = 42
flow_source_scale = 1.0e-3

[rollout]
# The exclusive sampler draws 32..95 steps, matching the upstream random
# rollout horizon while avoiding a fixed 96-step objective.
particles = 4096
step_min = 32
steps = 96
update_prob = 0.5
seed = 42
seed_scale = 0.2
seed_mode = "uniform-circle"

[target]
points = 4096
threshold = 0.05
loss_image_size = 128
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
# HyperNPA is selected on composited RGB PSNR. The zero-weight control learned
# conditional separation but plateaued near 12 dB, so train the measured image
# objective directly while retaining upstream color and density terms.
composited_rgb_loss_weight = 5.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0

[optimizer]
base_learning_rate = 1.0e-5
generator_learning_rate = 1.0e-4
base_weight_decay = 0.0
generator_weight_decay = 0.01
base_grad_clip_norm = 1.0
generator_grad_clip_norm = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 1.0e-8
base_per_parameter_grad_normalization = false
generator_per_parameter_grad_normalization = false
lr_schedule = "cosine"
warmup_steps = 2000
min_lr_scale = 0.05

[validation]
initial_examples = 8
examples = 32
interval = 2000
particles = 2048
steps = 256
horizons = [96, 256]
selection_horizon_min_steps = 256
update_prob = 0.5
seed = 42
psnr_threshold_db = 26.0
final_examples = 100
final_particles = 4096
final_steps = 512
final_horizons = [96, 256, 512]
final_selection_horizon_min_steps = 256
# Final-only, generated-adapter, graph-detached stability contract. The same
# held-out trajectories are measured at 512 and 4096 in one bounded rollout.
stability_examples = 16
stability_particles = 4096
stability_reference_steps = 512
stability_steps = 4096
stability_tail_steps = 256

[gates]
max_quality_validation_evaluations = 60
max_quality_validation_elapsed_fraction = 0.25
min_final_p10_composited_rgb_psnr_db = 26.0
min_final_condition_shuffle_composited_psnr_gap_db = 1.0
min_final_generated_adapter_composited_psnr_gain_db = 1.0
require_validation_interval_at_least_report_interval = true
fail_on_violation = true
