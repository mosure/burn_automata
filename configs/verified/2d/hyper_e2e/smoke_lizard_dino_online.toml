preset = "growing-2d"

[source]
target_images = ["assets/catalog_thumbnails/lizard.png"]

[output]
output_dir = "artifacts/hyper2d_e2e_rollout_smoke_lizard_steps1"

[condition]
encoder = "dino-vits-full-tokens"
dino_model = "models/dino/dino_vits.mpk"
dino_image_size = 518
dino_patch_size = 14
dino_batch_size = 1
online = true
token_attention_heads = 4

[model]
shared_base_trainable = true
shared_base_train_start_step = 0
shared_base_init = "upstream-seeded"
hidden_dims = 128
output_activation = "tanh"

[training]
backend = "gpu"
objective = "target2d-rollout-image-loss"
steps = 1
report_interval = 1
example_batch_size = 1
tbptt_chunk_steps = 2
target2d_loss_backend = "dense"
max_dense_train_particles = 512
system_memory_budget_gb = 12.0
gpu_memory_budget_gb = 8.0
seed = 42

[gpu]
backend = "burn-wgpu"
max_dense_chunk_floats = 262144
max_splat_chunk_floats = 262144
condition_device_cache_max_bytes = 8589934592

[adapter]
rank = 8
alpha = 8.0
generator = "token-aware-rectified-flow"
flow_hidden = 128
flow_sample_steps = 1
flow_source_scale = 1.0
init_scale = 1.0e-3

[rollout]
particles = 32
steps = 2
update_prob = 0.5
seed = 42
seed_mode = "uniform-circle"

[target]
points = 128
threshold = 0.05
loss_image_size = 32
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0

[optimizer]
learning_rate = 1.0e-4
base_learning_rate = 1.0e-4
generator_learning_rate = 1.0e-4
weight_decay = 0.0
base_weight_decay = 0.0
generator_weight_decay = 0.0
grad_clip_norm = 1.0
base_grad_clip_norm = 1.0
generator_grad_clip_norm = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 1.0e-8
per_parameter_grad_normalization = true

[validation]
examples = 1
interval = 1
particles = 32
steps = 2
update_prob = 0.5
seed = 42
psnr_threshold_db = 26.0

[gates]
min_median_particle_steps_per_sec = 1.0
max_quality_validation_evaluations = 3
max_quality_validation_elapsed_fraction = 1.0
fail_on_violation = true
