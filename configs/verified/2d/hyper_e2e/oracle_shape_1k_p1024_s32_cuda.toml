# Quality step-up after the 512p oracle-shaped run improves. Batch is reduced
# to keep the dense rollout graph bounded while preserving the 32..64 step
# curriculum and high-particle validation.
preset = "growing-2d"

[source]
source_limit = 1000

[source.omnisvg]
dataset = "illustration"
split = "train"
cache_dir = "data/omnisvg"
offset = 0
limit = 1000
page_size = 100
download = false
refresh = false
token_env = "HF_TOKEN"

[split]
holdout_stride = 20
holdout_offset = 0

[output]
output_dir = "artifacts/hyper2d_e2e_rollout_omnisvg_1k_oracle_shape_p1024_s32to64_rank16_cuda"

[condition]
encoder = "dino-vits-full-tokens"
dino_model = "models/dino/dino_vits.mpk"
dino_image_size = 518
dino_patch_size = 14
dino_batch_size = 16
online = true
token_attention_heads = 4

[model]
shared_base_trainable = true
shared_base_train_start_step = 0
shared_base_init = "upstream-seeded"
hidden_dims = 128
output_activation = "tanh"

[training]
backend = "gpu"
objective = "target2d-rollout-image-loss"
steps = 2000
report_interval = 100
example_batch_size = 1
tbptt_chunk_steps = 4
loss_on_final_chunk_only = false
tbptt_loss_mode = "endpoint-weighted"
tbptt_intermediate_loss_weight = 0.25
tbptt_final_loss_weight = 1.0
use_particle_pool = true
pool_slots_per_example = 2
inject_seed_interval = 64
pre_rollout_steps = 0
target2d_loss_backend = "tiled-adjoint"
perception_backend = "auto"
max_dense_train_particles = 1024
system_memory_budget_gb = 88.0
gpu_memory_budget_gb = 72.0
seed = 42

[gpu]
backend = "burn-cuda"
max_dense_chunk_floats = 524288
max_splat_chunk_floats = 524288
condition_device_cache_max_bytes = 8589934592

[adapter]
rank = 16
alpha = 16.0
generator = "token-aware-rectified-flow"
flow_hidden = 128
flow_sample_steps = 2
flow_source_scale = 1.0
init_scale = 1.0e-3

[rollout]
particles = 1024
step_min = 32
steps = 64
update_prob = 0.5
seed = 42
seed_mode = "uniform-circle"

[target]
points = 2048
threshold = 0.05
loss_image_size = 128
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0

[optimizer]
learning_rate = 1.0e-4
base_learning_rate = 1.0e-4
generator_learning_rate = 1.0e-4
weight_decay = 0.0
base_weight_decay = 0.0
generator_weight_decay = 0.0
grad_clip_norm = 1.0
base_grad_clip_norm = 1.0
generator_grad_clip_norm = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 1.0e-8
per_parameter_grad_normalization = true
lr_schedule = "cosine"
min_lr_scale = 0.1

[validation]
examples = 16
interval = 500
particles = 2048
steps = 64
update_prob = 0.5
seed = 42
psnr_threshold_db = 26.0

[gates]
min_median_particle_steps_per_sec = 750.0
max_quality_validation_elapsed_fraction = 0.25
require_validation_interval_at_least_report_interval = true
fail_on_violation = true
