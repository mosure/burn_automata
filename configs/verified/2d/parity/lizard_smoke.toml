[upstream]
repo_url = "https://github.com/TheDevilWillBeBee/NPA.git"
commit = "1176ead09ef34e21814fd6b1dd29ca661aedb5da"
cache_dir = ".cache/selforg_npa/NPA"
config = "configs/growing.yaml"
checkpoint = "data/pretrained/lizard.pth"
fixture = "artifacts/reference/selforg_npa/lizard_fixture.json"
require_fixture = false

[model]
bpk = "models/catalog/growing/lizard.bpk"
target_image = "assets/reference_targets/lizard_upstream_120.png"

[validation]
particles = 128
steps = 4
update_prob = 0.5
seed = 42
seed_scale = 0.2
seed_mode = "uniform-circle"
target_points = 4096
target_image_size = 120
target_threshold = 0.05
loss_image_size = 64
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
background_density_loss_weight = 0.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0
max_total_loss = 1000000.0
target_color_tolerance = 0.02
