# Phase two of the validated strict zero-output-bias catalog control. This
# backpropagates through the same eight-step Heun sampler used by serialized
# inference. The 2026-07-27 reference run reached 23.38 dB aggregate PSNR at
# 256px, 4096 particles, and 1024 rollout steps after 250 optimizer steps.
preset = "growing-2d"

[source]
target_image_dirs = [".cache/selforg_npa/targets/growing"]
image_extensions = ["png"]

[output]
output_dir = "artifacts/hyper2d_verified_growing_row_flow_endpoint_refine"
checkpoint_interval_steps = 100
checkpoint_interval_seconds = 600
auto_resume = true

[condition]
encoder = "dino-vits-full-tokens"
dino_model = "models/dino/dino_vits.mpk"
dino_image_size = 224
dino_patch_size = 14
dino_batch_size = 10
online = true
token_attention_heads = 12
rgb_channels = true
alpha_channel = true
patch_pixels = true

[model]
shared_base = "artifacts/hyper2d_verified_growing_row_flow_s_pretrain/checkpoints/best_shared_base.bpk"
hyper = "artifacts/hyper2d_verified_growing_row_flow_s_pretrain/checkpoints/best_hyper_2d.bpk"
oracle_model_dir = "models/catalog/growing"
shared_base_trainable = false
hidden_dims = 128
output_activation = "identity"

[training]
backend = "gpu"
objective = "conditional-row-flow-matching"
steps = 250
report_interval = 20
example_batch_size = 10
credit_assignment = "full-bptt"
task_loss_weight = 0.0
adapter_teacher_weight = 1.0
adapter_teacher_objective = "parameter-mse"
flow_matching_weight = 0.1
flow_match_inference_source = true
flow_train_sample_steps = 8
max_full_bptt_particle_steps = 10240
use_particle_pool = false
rollouts_per_example = 2
target2d_loss_backend = "tiled-adjoint"
perception_backend = "auto"
max_dense_train_particles = 32
system_memory_budget_gb = 24.0
gpu_memory_budget_gb = 90.0
seed = 42

[gpu]
backend = "burn-cuda"
max_dense_chunk_floats = 1048576
max_splat_chunk_floats = 1048576
condition_device_cache_max_bytes = 2147483648
target_device_cache_max_bytes = 2147483648

[adapter]
rank = 66
alpha = 66.0
generator = "conditional-row-flow"
parameterization = "dense-npa-row-residual"
attention_normalization = "softmax"
flow_hidden = 768
flow_layers = 12
flow_ffn_dims = 3072
flow_sample_steps = 8
flow_source_seed = 42
flow_source_scale = 1.0e-3

[rollout]
particles = 32
steps = 1
update_prob = 0.5
seed = 42
seed_scale = 0.2
seed_mode = "uniform-circle"

[target]
points = 4096
threshold = 0.05
loss_image_size = 256
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0

[optimizer]
base_learning_rate = 0.0
generator_learning_rate = 3.0e-5
base_weight_decay = 0.0
generator_weight_decay = 0.0
base_grad_clip_norm = 0.0
generator_grad_clip_norm = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 1.0e-8
per_parameter_grad_normalization = false
base_per_parameter_grad_normalization = false
generator_per_parameter_grad_normalization = false
lr_schedule = "constant"
warmup_steps = 0
min_lr_scale = 1.0

[validation]
initial_examples = 10
examples = 10
interval = 250
particles = 4096
steps = 1024
horizons = [96, 256, 512, 1024]
selection_horizon_min_steps = 96
update_prob = 0.5
seed = 42
seed_count = 1
psnr_threshold_db = 22.0
final_examples = 10
final_particles = 4096
final_steps = 1024
final_horizons = [96, 256, 512, 1024]
final_selection_horizon_min_steps = 96
final_seed_count = 1

[gates]
max_quality_validation_evaluations = 3
max_quality_validation_elapsed_fraction = 0.40
require_validation_interval_at_least_report_interval = true
fail_on_violation = false
