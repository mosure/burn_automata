preset = "growing-2d"

[source]
target_images = [
  ".cache/selforg_npa/targets/growing/rose.png",
  ".cache/selforg_npa/targets/growing/tropical_fish.png",
]

[output]
output_dir = "artifacts/hyper2d_verified_growing_catalog_nonbase_eval"

[condition]
encoder = "dino-vits-full-tokens"
dino_model = "models/dino/dino_vits.mpk"
dino_image_size = 224
dino_patch_size = 14
dino_batch_size = 1
online = true
token_attention_heads = 4
alpha_channel = true

[model]
shared_base = "artifacts/hyper2d_verified_growing_catalog_refine/shared_base.bpk"
hyper = "artifacts/hyper2d_verified_growing_catalog_refine/hyper_2d.bpk"
shared_base_trainable = false
hidden_dims = 128
output_activation = "tanh"

[training]
backend = "gpu"
objective = "target2d-rollout-image-loss"
steps = 1
report_interval = 1
example_batch_size = 1
credit_assignment = "full-bptt"
max_full_bptt_particle_steps = 32
task_loss_weight = 0.0
adapter_teacher_weight = 0.0
target2d_loss_backend = "tiled-adjoint"
perception_backend = "auto"
max_dense_train_particles = 32
system_memory_budget_gb = 12.0
gpu_memory_budget_gb = 16.0
seed = 42

[gpu]
backend = "burn-wgpu"
max_dense_chunk_floats = 524288
max_splat_chunk_floats = 524288
condition_device_cache_max_bytes = 1073741824

[adapter]
rank = 82
alpha = 82.0
generator = "token-attention-pool"
adapter_chunk_size = 64
flow_hidden = 128
flow_sample_steps = 1
flow_source_scale = 2.0
init_scale = 1.0e-3

[rollout]
particles = 32
steps = 1
update_prob = 0.5
seed = 42
seed_scale = 0.2
seed_mode = "uniform-circle"

[target]
points = 4096
threshold = 0.05
loss_image_size = 32
splat_sigma = 1.0
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0

[optimizer]
learning_rate = 0.0
base_learning_rate = 0.0
generator_learning_rate = 0.0
per_parameter_grad_normalization = false
base_per_parameter_grad_normalization = false
generator_per_parameter_grad_normalization = false

[validation]
initial_examples = 0
examples = 2
interval = 1
particles = 4096
steps = 1024
horizons = [96, 256, 512, 1024]
selection_horizon_min_steps = 256
update_prob = 0.5
seed = 42
psnr_threshold_db = 26.0

[gates]
min_median_particle_steps_per_sec = 1.0
max_quality_validation_evaluations = 2
max_quality_validation_elapsed_fraction = 1.0
fail_on_violation = false
