[shared_base]
output = "artifacts/render3d_adapter_suite_many_slice/shared_base.bpk"
cycles = 3
seed = 5904189

[targets]
target_set = "many"
targets = ["torus", "teapot", "sphere", "cube", "capsule", "cross"]
holdout_targets = ["capsule", "cross"]
auto_holdout_stride = 0
auto_holdout_offset = 0

[output]
output_dir = "artifacts/render3d_adapter_suite_many_slice"
report_output = "artifacts/render3d_adapter_suite_many_slice/report.json"
adapter_bank_output = "artifacts/render3d_adapter_suite_many_slice/adapter_bank.json"

[training]
skip_shared_base_eval = false
rounds = 4
supervised_steps_per_round = 32
particles = 512
rollout_steps = 32
gradient_particles = 64
gradient_mode = "analytic"
finite_diff_eps = 1.0e-3
motion_gain = 0.35
perception_position_gain = 0.05
max_update_norm = 1.0
trajectory_supervision = true
backend = "direct-rollout"

[objective]
direct_output_gradient_rms_cap = 1.0
direct_line_search = true
direct_line_search_scales = [0.0625, 0.125, 0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
direct_material_output_only = false

[optimizer]
learning_rate = 5.0e-4
grad_clip_norm = 1.0

[adapter]
rank = 8
alpha = 8.0
seed = 11381043

[seed]
selection_seed = 5353789
extra_selection_seeds = [42, 99]
direct_selection_seed_training = false

[render]
image_size = 64
target_samples = 4096
sigma = 2.5
min_sigma = 0.75
max_sigma = 5.0
gaussian_decode_mode = "fixed-sh0"
opacity_logit_bias = 0.0
density_weight = 1.0
color_weight = 1.0
depth_weight = 1.0

[validation]
fail_on_validation = true
