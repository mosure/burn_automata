target = "torus"

[output]
model_output = "artifacts/render3d_torus_oracle_smoke/model.bpk"
report_output = "artifacts/render3d_torus_oracle_smoke/report.json"

[training]
rounds = 1
supervised_steps_per_round = 1
particles = 64
rollout_steps = 8
gradient_particles = 16
gradient_mode = "analytic"
finite_diff_eps = 1.0e-3
motion_gain = 0.35
perception_position_gain = 0.05
max_update_norm = 1.0
trajectory_supervision = true
backend = "direct-rollout"
weight_update_mode = "adapter"

[objective]
trajectory_render_gain = 0.25
trajectory_mesh_gain = 0.5
trajectory_render_samples = 512
liveness_gain = 0.35
liveness_front_radius = 0.24
liveness_update_multiplier = 0.5
coverage_gain = 0.35
coverage_samples = 512
coverage_mode = "sliced-ot"
coverage_softness = 0.0
coverage_repulsion_gain = 0.2
coverage_repulsion_radius = 0.0
coverage_normal_weight = 0.0
extent_gain = 0.2
full_coverage_adjoint = false
surface_gain = 0.35
surface_escape_gain = 0.1
opacity_gain = 0.02
material_liveness_gain = 0.35
material_tail_gain = 0.2
material_suppression_update_multiplier = 0.5
material_max_opacity_update = 0.2
scale_gain = 0.1
scale_budget_weight = 0.1
max_opacity_update = 0.05
direct_output_gradient_rms_cap = 1.0
direct_line_search = true
direct_line_search_scales = [0.25, 0.5, 1.0, 2.0]
direct_material_output_only = false

[optimizer]
learning_rate = 5.0e-4
grad_clip_norm = 1.0

[adapter]
rank = 8
alpha = 8.0
seed = 11327859

[seed]
selection_seed = 5353789
extra_selection_seeds = [42, 99]
direct_selection_seed_training = false

[render]
image_size = 32
target_samples = 512
sigma = 2.5
min_sigma = 0.75
max_sigma = 5.0
gaussian_decode_mode = "fixed-sh0"
opacity_logit_bias = 0.0
density_weight = 1.0
color_weight = 1.0
depth_weight = 1.0

[validation]
fail_on_validation = false
