[mesh]
builtin = "utah_teapot"

[output]
model = "artifacts/mesh3d/utah_teapot_smoke/model.bpk"
report = "artifacts/mesh3d/utah_teapot_smoke/report.json"

[training]
scale = 0.72
hidden_dims = 128
dataset_particles = 256
dataset_trajectories = 2
teacher_rollout_max_steps = 2
dataset_refreshes = 2
replay_accumulate = true
steps = 8
report_interval = 4
seed = 42
near_surface_fraction = 0.35
surface_fraction = 0.15
surface_erasure_fraction = 0.5
deployment_surface_fraction = 0.5
deployment_damage_fraction = 0.5
max_motion_per_step = 0.065
normal_gain = 0.35
signed_distance_gain = 0.35
opacity_gain = 0.25
color_gain = 0.35

[training.optimizer]
learning_rate = 1.0e-3
weight_decay = 1.0e-6
grad_clip_norm = 1.0
beta1 = 0.9
beta2 = 0.999
epsilon = 1.0e-8

[training.evaluation]
particle_count = 256
seed_scale = 0.72
rollout_steps = [0, 2]
seeds = [42]
target_samples = 128
render_image_size = 32
render_target_samples = 256
damage_radius = 0.22
damage_displacement = 0.0
recovery_min_steps = 2
max_mean_surface_distance = 1.0
max_p95_surface_distance = 1.0
max_mean_coverage_distance = 1.0
min_coverage_fraction = 0.0
min_density_psnr_db = -100.0
min_color_psnr_db = -100.0
min_damage_region_color_psnr_db = -100.0
max_long_horizon_drift = 1.0
