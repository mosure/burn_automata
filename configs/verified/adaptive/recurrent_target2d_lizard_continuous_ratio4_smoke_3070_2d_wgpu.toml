# Bounded direct-active continuous-scale lizard regression.
#
# This smoke rebuilds the broad candidate from the trained scale-conditioned
# rule and exercises the same 3,070-row, 4x-measure, eight-exchange path on four
# seeds. Full 32-seed quality evidence remains a nonpromoted sandbox experiment.
backend = "wgpu"

[source]
target_image = "assets/reference_targets/lizard_upstream_120.png"
rule_model = "artifacts/adaptive/checkpoints/recurrent_lizard_graded144_fullrule_primal_k4_age4096_tbpttfix_best.bpk"
oracle_model = "models/catalog/growing/lizard.bpk"

[output]
model = "artifacts/adaptive/continuous_scale_ratio4/lizard_ratio4_candidate.adaptive.bpk"
evaluation_report = "artifacts/adaptive/continuous_scale_ratio4/lizard_ratio4_candidate_smoke.json"

[model]
rule_seed = 42
controller_seed = 2902616621

[target]
points = 4096
threshold = 0.05
image_size = 120

[hashgrid]
dim = 2
boundary = "Clamped"
mode = "Particle"
grid_size = [64, 64, 1]
eps = 0.1
max_particles_per_block = 32

[training]
rule_training = "shared-scale-conditioned-rule"
restriction_policy = "dynamics-detail"
optimize_material_scale_only = false

[training.target2d]
particle_count = 3070
step_max = 64
tbptt_chunk_steps = 64

[training.material]
reference_particle_count = 4096
total_measure = 0.12566371
fine_bandwidth = 0.1
bandwidth_exponent = 0.0
max_initial_fine_units = 8
seed_layout = "graded-continuous"
seed_measure_ratio = 4.0

[training.topology]
enabled = true
start_step = 64
end_step = 512
split_radius_scale = 1.0
merge_detail_scale = 0.01
min_relative_gain = 0.0
interval_steps = 64
events_per_interval = 8

[loss]
image_size = 256
sigma = 1.0
lo = -1.0
hi = 1.0
center = false
splat_loss_weight = 1.0
color_loss_weight = 0.0
density_loss_weight = 0.0
background_density_loss_weight = 0.0
foreground_density_loss_weight = 0.0
composited_rgb_loss_weight = 0.0
render_rgb_loss_weight = 1.0
shape_chamfer_loss_weight = 0.0
displacement_regularizer_weight = 0.0
overflow_regularizer_weight = 0.0
bound_regularizer_weight = 0.0

[validation]
require_adaptive_resolution = true
adaptive_resolution_horizon_min_steps = 256
min_material_scale_ratio = 1.99
min_adaptive_support_bin_count = 1
min_occupied_material_scale_bins = 32
min_accepted_local_detail_exchanges = 1
min_mean_scale_detail_correlation_gain_vs_static = 0.05
min_worst_scale_detail_correlation_gain_vs_static = 0.0
min_mean_static_graded_psnr_gain_db = 0.0
min_worst_static_graded_psnr_gain_db = -1.0
seeds = [42, 43, 44, 45]
horizons = [96, 256, 512, 1024]
update_prob = 0.5
seed_scale = 0.2
seed_mode = "UniformCircle"
dt = 1.0
topology_enabled = true
min_adaptive_psnr_db = 23.0
max_oracle_psnr_gap_db = 4.0
max_same_rule_fine_psnr_gap_db = 4.0
max_psnr_drift_db = 2.0
quality_horizon_min_steps = 256
min_quality_mean_adaptive_psnr_db = 25.0
min_quality_worst_adaptive_psnr_db = 23.5
max_quality_mean_oracle_gap_db = 1.5
max_quality_worst_oracle_gap_db = 3.0
max_quality_mean_same_rule_fine_gap_db = 1.5
max_quality_worst_same_rule_fine_gap_db = 3.0
max_material_relative_error = 0.00002
max_out_of_bounds_fraction = 0.01
max_grid_overflow = 0
max_interaction_work_ratio = 0.8
max_wall_time_ratio = 1.2
