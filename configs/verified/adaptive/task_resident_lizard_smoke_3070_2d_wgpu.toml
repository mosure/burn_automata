# Bounded correctness and throughput smoke for genuine resident adaptive NPA.
# The rollout starts with 1,024 recurrent coarse rows, reserves 3,070 rows once,
# and activates a canonical 3,070-row mixed cut over three device-only topology
# tranches. No fine child templates or hidden fine dynamics are retained.
report_output = "artifacts/adaptive_npa/resident_lizard_3070/smoke-report.json"
model_output = "artifacts/adaptive_npa/resident_lizard_3070/smoke-model.adaptive.bpk"
base_model = "models/catalog/growing/lizard.bpk"
seed = 42
backend = "wgpu"

[adaptive]
