# Verified fixed-graded relocation ablation for the direct-active recurrent
# lizard. This preserves the measured 3,070-row quality/work result, but its
# 1.20x radius span and fixed interaction support do not satisfy the canonical
# adaptive-resolution promotion contract.
#
# The input is the selected full-rule CUDA checkpoint. Evaluation overrides the
# training-time topology budget with one paired exchange per 95-step pass and
# writes a deployment artifact only after every numerical gate passes.
backend = "wgpu"

[source]
target_image = "assets/reference_targets/lizard_upstream_120.png"
adaptive_model = "artifacts/adaptive/recurrent_target2d_lizard_upstreamloss_graded144_fullrule_tail25_age4096.adaptive.bpk"
oracle_model = "models/catalog/growing/lizard.bpk"

[output]
model = "artifacts/adaptive/recurrent_target2d_lizard_upstreamloss_graded144_fullrule_events1_validated.adaptive.bpk"
evaluation_report = "artifacts/adaptive/eval/recurrent_lizard_upstreamloss_fullrule_topology_events1_validated.json"

[target]
points = 4096
threshold = 0.05
image_size = 120

[hashgrid]
dim = 2
boundary = "Clamped"
mode = "Particle"
grid_size = [64, 64, 1]
eps = 0.1
max_particles_per_block = 32

[training]
rule_training = "shared-scale-conditioned-rule"
restriction_policy = "dynamics-detail"

[training.target2d]
particle_count = 3070
step_max = 95
tbptt_chunk_steps = 95

[training.material]
reference_particle_count = 4096
total_measure = 0.12566371
fine_bandwidth = 0.1
bandwidth_exponent = 0.0
max_initial_fine_units = 4
seed_layout = "graded-continuous"
seed_measure_ratio = 1.44

[training.topology]
enabled = true
start_step = 95
end_step = 475
split_radius_scale = 1.0
merge_detail_scale = 0.01
min_relative_gain = 0.0
interval_steps = 95
events_per_interval = 1

[loss]
image_size = 256
sigma = 1.0
lo = -1.0
hi = 1.0
center = true
splat_loss_weight = 2.0
color_loss_weight = 5.0
density_loss_weight = 1.0
background_density_loss_weight = 0.0
foreground_density_loss_weight = 0.0
composited_rgb_loss_weight = 0.0
render_rgb_loss_weight = 0.0
shape_chamfer_loss_weight = 0.0
displacement_regularizer_weight = 0.01
overflow_regularizer_weight = 100.0
bound_regularizer_weight = 100.0

[validation]
require_adaptive_resolution = false
seeds = [42, 43, 44, 45, 46, 47, 48, 49]
horizons = [96, 256, 512, 1024, 2048, 4096]
update_prob = 0.5
seed_scale = 0.2
seed_mode = "UniformCircle"
dt = 1.0
topology_enabled = true
min_adaptive_psnr_db = 22.5
max_oracle_psnr_gap_db = 3.0
max_same_rule_fine_psnr_gap_db = 5.0
max_psnr_drift_db = 1.0
quality_horizon_min_steps = 512
min_quality_mean_adaptive_psnr_db = 26.0
min_quality_worst_adaptive_psnr_db = 24.0
max_quality_mean_oracle_gap_db = 0.5
max_quality_worst_oracle_gap_db = 0.5
max_quality_mean_same_rule_fine_gap_db = 0.5
max_quality_worst_same_rule_fine_gap_db = 0.5
max_material_relative_error = 0.00002
max_out_of_bounds_fraction = 0.01
max_grid_overflow = 0
max_interaction_work_ratio = 0.8
max_wall_time_ratio = 1.1
