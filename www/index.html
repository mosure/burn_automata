<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1114" />
    <title>burn_automata</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="boot-status" role="status" aria-live="polite">
      <strong>burn_automata</strong>
      <span id="boot-message">initializing WebGPU</span>
    </div>
    <noscript>JavaScript is required to run burn_automata.</noscript>
    <script type="module">
      const status = document.getElementById("boot-status");
      const message = document.getElementById("boot-message");

      if (!navigator.gpu) {
        status.dataset.state = "error";
        message.textContent = "WebGPU is unavailable. Use a current Chrome, Edge, or Firefox build.";
      } else {
        try {
          const { default: init } = await import("./pkg/bevy_automata.js");
          await init();
          status.dataset.state = "ready";
          window.setTimeout(() => status.remove(), 500);
        } catch (error) {
          console.error(error);
          status.dataset.state = "error";
          message.textContent = `failed to start: ${error?.message ?? error}`;
        }
      }
    </script>
  </body>
</html>
