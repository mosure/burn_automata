[package]
name = "bevy_automata"
description = "Bevy viewer for burn_automata neural particle automata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[features]
default = ["viewer", "splatting", "gpu_wgpu", "hyper_dino_wgpu", "mesh_training", "headless"]
viewer = ["burn_automata/import", "dep:crossbeam-channel"]
splatting = ["dep:bevy_gaussian_splatting"]
gpu_wgpu = ["burn_automata/gpu_wgpu"]
hyper_dino = ["burn_automata/dino", "dep:image", "dep:rfd", "dep:serde_json"]
hyper_dino_wgpu = ["hyper_dino", "burn_automata/backend_wgpu"]
hyper_dino_cuda = ["hyper_dino", "burn_automata/backend_cuda"]
mesh_training = ["viewer", "dep:rfd", "burn_automata/backend_wgpu"]
headless = ["viewer", "splatting", "gpu_wgpu", "dep:clap", "dep:image", "dep:serde_json"]

[dependencies]
burn_automata = { path = "../burn_automata", version = "0.1.0", default-features = false, features = ["backend_ndarray"] }
bevy = { workspace = true, features = [
  "bevy_asset",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_log",
  "bevy_pbr",
  "bevy_render",
  "bevy_scene",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "multi_threaded",
  "picking",
  "png",
  "std",
  "tonemapping_luts",
  "webgpu",
  "x11",
  "zstd_rust",
] }
bevy_burn.workspace = true
bevy_gaussian_splatting = { workspace = true, optional = true, features = [
  "buffer_storage",
  "io_flexbuffers",
  "planar",
  "sh3",
  "sort_radix",
  "viewer",
] }
bevy_panorbit_camera.workspace = true
bevy_ui_widgets.workspace = true
clap = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
getrandom.workspace = true
getrandom_03.workspace = true
image = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "ErrorEvent",
  "MessageEvent",
  "Response",
  "Window",
  "Worker",
  "WorkerOptions",
  "WorkerType",
] }

[dev-dependencies]
image.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bevy_automata"
path = "src/main.rs"
