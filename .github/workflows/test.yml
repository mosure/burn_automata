name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci/check_repository_layout.sh
      - run: scripts/ci/check_inference_features.sh
      - run: cargo fmt --all --check
      - run: cargo check -p burn_automata_kernels -p burn_automata --all-targets
      - run: cargo check -p burn_automata --examples --benches
      - run: cargo check -p burn_automata --no-default-features --features backend_wgpu
      - run: cargo check -p burn_automata --no-default-features --features gpu_wgpu
      - run: cargo test -p burn_automata_kernels -p bevy_burn
      - name: Test portable Burn core
        run: cargo test -p burn_automata --lib --no-default-features --features "backend_ndarray cli import"
      - name: Test portable integration surface
        # Catalog growth gates require local, gitignored 3D model artifacts.
        run: >-
          cargo test -p burn_automata --test core --no-default-features
          --features "backend_ndarray cli import" -- --skip catalog_growth::
      - run: cargo test -p burn_automata --test gpu_wgpu --no-default-features --features gpu_wgpu
      - name: Link Bevy GPU integration tests
        # Hosted runners have no graphics adapter; execute these on GPU hosts.
        run: cargo test -p bevy_automata --no-default-features --features "splatting gpu_wgpu" --test gaussian_gpu_link --no-run
      - run: cargo check -p bevy_automata --no-default-features --features viewer
      - run: cargo check -p bevy_automata
