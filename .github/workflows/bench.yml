name: bench

on:
  workflow_dispatch:

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v3
      - run: scripts/bench_rollout.sh
      - run: cargo bench -p burn_automata --bench rollout -- --sample-size 10
