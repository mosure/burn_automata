name: bench

on:
  workflow_dispatch:

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci/bench_rollout.sh
      - run: cargo bench -p burn_automata --bench rollout -- --sample-size 10
